[package]
name = "rustfs-kafka-async"
version.workspace = true
authors.workspace = true
categories = ["api-bindings", "asynchronous"]
edition.workspace = true
keywords = ["kafka", "queue", "async", "tokio"]
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Async Kafka client built on tokio"
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rustfs-kafka = { workspace = true, features = ["security"] }
bytes.workspace = true
kafka-protocol.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros", "fs"] }
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
tracing.workspace = true
metrics = { workspace = true, optional = true }
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
pbkdf2.workspace = true
rand.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = ["metrics", "compression"]
metrics = ["dep:metrics", "rustfs-kafka/metrics"]
gzip = ["rustfs-kafka/gzip", "kafka-protocol/gzip"]
snappy = ["rustfs-kafka/snappy", "kafka-protocol/snappy"]
lz4 = ["rustfs-kafka/lz4", "kafka-protocol/lz4"]
zstd = ["rustfs-kafka/zstd", "kafka-protocol/zstd"]
compression = ["gzip", "snappy", "lz4", "zstd"]
integration_tests = []
